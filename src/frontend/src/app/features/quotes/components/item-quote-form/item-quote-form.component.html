<form class="feature-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="form-field">
    <span id="item-quote-supplier-label" class="form-label">Fornecedor</span>
    <select
      class="select w-full"
      formControlName="supplierId"
      aria-labelledby="item-quote-supplier-label"
      [class.select-error]="form.controls.supplierId.touched && form.controls.supplierId.invalid"
      [attr.aria-invalid]="form.controls.supplierId.touched && form.controls.supplierId.invalid"
    >
      <option value="" disabled>Selecione um fornecedor</option>
      @for (supplier of suppliers(); track supplier.id) {
        <option [value]="supplier.id">{{ supplier.name }}</option>
      }
    </select>
    @if (form.controls.supplierId.touched && form.controls.supplierId.invalid) {
      <small>Selecione um fornecedor cadastrado.</small>
    }
  </div>
  <label>
    <span>Preço unitário (R$)</span>
    <input
      class="input w-full"
      type="number"
      formControlName="unitPrice"
      min="0"
      step="0.01"
      [class.input-error]="form.controls.unitPrice.touched && form.controls.unitPrice.invalid"
      [attr.aria-invalid]="form.controls.unitPrice.touched && form.controls.unitPrice.invalid"
    />
    @if (form.controls.unitPrice.touched && form.controls.unitPrice.invalid) {
      <small>Use um preço maior ou igual a zero.</small>
    }
  </label>
  <p class="form-hint">O preço total será calculado automaticamente pela quantidade do item.</p>
  @if (serverError()) {
    <p class="form-error" role="alert">{{ serverError() }}</p>
  }
  <div class="form-actions">
    <button class="btn" type="button" [disabled]="submitting()" (click)="cancel()">Cancelar</button>
    <button class="btn btn-primary" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <span class="loading loading-spinner loading-sm" aria-hidden="true"></span>
      }
      {{
        submitting() ? 'Salvando...' : mode() === 'create' ? 'Adicionar preço' : 'Salvar alterações'
      }}
    </button>
  </div>
</form>
