<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="referrer" content="no-referrer">
  <title>Planejador de Compras | Cotação de compras com IA</title>
  <meta name="description" content="Sistema de cotação e pedido de compra para mercados, restaurantes, lojas e clínicas. Envie a cotação em PDF, compare fornecedores no mapa de preços e emita o pedido.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Planejador de Compras">
  <meta property="og:title" content="Planejador de Compras">
  <meta property="og:description" content="Cotação de compras com IA, sem planilha e direto no WhatsApp. Cotação em PDF, mapa de preços e pedido de compra em um lugar só.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    // Aplica o tema salvo (ou o do sistema) antes da primeira pintura, para a página não piscar.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('planejador-theme'); } catch (error) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      var root = document.documentElement;
      root.setAttribute('data-theme', theme === 'dark' ? 'claude-dark' : 'claude');
      root.setAttribute('data-app-theme', theme);
      root.style.colorScheme = theme;
    })();
  </script>
  <script src="/env.js"></script>
</head>
<body>
  <app-root>
    <!-- Skeleton exibido até o aplicativo carregar; o Angular substitui este conteúdo. -->
    <div class="min-h-screen bg-base-100" role="status" aria-busy="true">
      <span class="visually-hidden">Carregando…</span>
      <div class="border-b border-base-300">
        <div class="mx-auto flex h-16 w-full max-w-6xl items-center gap-4 px-4 sm:px-6">
          <div class="skeleton size-8"></div>
          <div class="skeleton h-4 w-40"></div>
          <div class="skeleton ml-auto h-8 w-28"></div>
        </div>
      </div>
      <div class="mx-auto w-full max-w-6xl px-4 pt-14 sm:px-6 sm:pt-20">
        <div class="skeleton h-12 w-full max-w-2xl"></div>
        <div class="skeleton mt-6 h-5 w-full max-w-xl"></div>
        <div class="skeleton mt-3 h-5 w-2/3 max-w-md"></div>
        <div class="mt-8 flex gap-3">
          <div class="skeleton h-12 w-44"></div>
          <div class="skeleton h-12 w-44"></div>
        </div>
        <div class="skeleton mt-16 h-96 w-full"></div>
      </div>
    </div>
  </app-root>
</body>
</html>
