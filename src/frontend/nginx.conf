server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml application/xml;

    # Cabeçalhos de segurança: os dois arquivos abaixo são gerados na subida do contêiner por
    # docker-entrypoint.d/45-security-headers.sh.
    #   security-headers.conf          nosniff, anti-clickjacking, Referrer-Policy, HSTS etc.
    #   content-security-policy.conf   CSP (depende da URL da API e dos hashes do build)
    # No nginx, um add_header dentro de um location descarta os herdados do server. Por isso
    # cada location que define Cache-Control inclui os cabeçalhos de segurança de novo.
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/content-security-policy.conf;

    # Páginas públicas saem pré-renderizadas (index.html de cada pasta).
    # Qualquer outra rota é do aplicativo e recebe a casca sem conteúdo (index.csr.html).
    location / {
        try_files $uri $uri/index.html /index.csr.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/content-security-policy.conf;
    }

    # Link público do fornecedor: o endereço carrega um token. Não indexar, não guardar em
    # cache e não repassar o endereço como "referer".
    location ^~ /cotacao/ {
        try_files /index.csr.html =404;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Arquivos com hash no nome nunca mudam: cache longo. Arquivo que não existe responde 404.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|avif|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.(?:txt|xml|json)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Configuração gerada na subida do contêiner: nunca em cache.
    location = /env.js {
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
